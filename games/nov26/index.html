<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Marsyas Island Resident Are You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="scene" aria-hidden="true">

    <g class="sway"><path class="wave-mid" d="M-100 175 C 120 140, 300 210, 520 170 S 880 130, 1080 180 S 1260 190, 1300 165 L1300 300 L-100 300 Z"/></g>
    <path class="wave-front" d="M-100 235 C 150 210, 330 265, 560 232 S 920 200, 1300 238 L1300 300 L-100 300 Z"/>
  </svg>
</div>

<main>
  <section class="card enter" id="card" aria-live="polite"></section>
</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
